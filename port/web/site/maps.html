<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenRealm: choose a map</title>
</head>
<body>
<main>
<h1>Choose a map</h1>
<p>Use desktop Chrome or Firefox with WebGL enabled. VS Code's embedded browser may not support the game.</p>
<p>Basic terrain and models. Simple bots fill the other player slots.</p>
<form action="index.html" method="get">
<label>Other players
<select name="bots">
<option value="1">Simple bots</option>
<option value="0">Leave empty</option>
</select>
</label>
<p><button type="submit" name="map" value="apricot">Apricot — Troopers vs Zombies</button></p>
<p><button type="submit" name="map" value="peach">Peach — Capture the Flag</button></p>
</form>
<p>Apricot's zombie heroes arrive after 90 seconds. Peach begins with a tutorial.</p>
</main>
</body>
</html>
